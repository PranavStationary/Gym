<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress</title>
    <style>
        :root {
            --bg: #000000;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f5f5f7;
            --text-muted: #86868b;
            --accent: #0a84ff;
            --radius: 24px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Premium Film Grain Noise Overlay */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Ambient Lighting */
        .ambient-glow {
            position: fixed;
            top: -30vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 80vh;
            background: radial-gradient(circle at center, rgba(10, 132, 255, 0.15) 0%, rgba(191, 90, 242, 0.05) 30%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 120px 24px 160px;
            position: relative;
            z-index: 1;
        }

        /* Hero */
        header {
            text-align: center;
            margin-bottom: 80px;
            opacity: 0;
            transform: translateY(40px) scale(0.98);
            animation: revealHero 1.2s var(--ease) forwards;
        }

        @keyframes revealHero {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #ffffff 0%, #6e6e73 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            margin-bottom: 48px;
        }

        .stats {
            display: inline-flex;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(40px);
            padding: 16px 32px;
            border-radius: 100px;
            gap: 48px;
        }

        .stat-item { text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

        /* Input Card */
        .input-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px;
            margin-bottom: 48px;
            backdrop-filter: blur(40px);
            transition: border-color 0.4s var(--ease), background 0.4s var(--ease);
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1s 0.2s var(--ease) forwards;
        }

        @keyframes revealUp { to { opacity: 1; transform: translateY(0); } }

        .input-card:focus-within {
            border-color: rgba(10, 132, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
        }

        .textarea-wrapper { padding: 20px 24px 8px; }
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 400;
            resize: none;
            min-height: 40px;
            letter-spacing: -0.01em;
        }
        textarea::placeholder { color: #515156; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 12px 12px 24px;
        }

        .category-pills { display: flex; gap: 8px; }

        .pill {
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(255,255,255,0.04);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s var(--ease);
            user-select: none;
        }
        .pill:hover { color: var(--text); background: rgba(255,255,255,0.08); }
        .pill.active { color: var(--text); background: var(--text); color: #000; }

        .log-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 28px;
            border-radius: 100px;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s var(--ease), opacity 0.2s;
        }
        .log-btn:hover { opacity: 0.9; }
        .log-btn:active { transform: scale(0.95); }

        /* Progress Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(40px);
            transition: transform 0.4s var(--ease), border-color 0.4s var(--ease);
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: revealUp 0.6s var(--ease) forwards;
            overflow: hidden;
        }

        .card:hover {
            border-color: rgba(255,255,255,0.16);
            transform: translateY(-4px) scale(1.01);
        }

        /* Mouse Tracking Spotlight */
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.06), transparent 40%);
            opacity: 0;
            transition: opacity 0.4s var(--ease);
            pointer-events: none;
        }
        .card:hover::before { opacity: 1; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tag.career { background: rgba(10, 132, 255, 0.1); color: #0a84ff; }
        .tag.learning { background: rgba(191, 90, 242, 0.1); color: #bf5af2; }
        .tag.fitness { background: rgba(48, 209, 88, 0.1); color: #30d158; }
        .tag.life { background: rgba(255, 159, 10, 0.1); color: #ff9f0a; }
        .tag.mindset { background: rgba(255, 55, 95, 0.1); color: #ff375f; }

        .date { font-size: 0.75rem; color: #515156; }

        .content {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #e5e5ea;
            position: relative;
            z-index: 2;
            letter-spacing: -0.01em;
        }

        .delete-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.05);
            border: none;
            color: #86868b;
            width: 24px; height: 24px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s var(--ease);
            z-index: 3;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem;
        }
        .card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #ff375f; color: #fff; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #515156;
            padding: 80px 40px;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            font-size: 1.1rem;
        }

        /* Footer */
        .footer {
            margin-top: 64px;
            text-align: center;
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.3s var(--ease);
        }
        .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: var(--surface); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <div class="container">
        <header>
            <h1>Life Progress</h1>
            <p class="subtitle">A private ledger of your evolution.</p>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="total-count">0</div>
                    <div class="stat-label">Total Logs</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="streak-count">0</div>
                    <div class="stat-label">Streak (Days)</div>
                </div>
            </div>
        </header>

        <div class="input-card">
            <div class="textarea-wrapper">
                <textarea id="input" placeholder="What did you accomplish today?" rows="1"></textarea>
            </div>
            <div class="controls">
                <div class="category-pills">
                    <div class="pill active" data-cat="career">Career</div>
                    <div class="pill" data-cat="learning">Learning</div>
                    <div class="pill" data-cat="fitness">Fitness</div>
                    <div class="pill" data-cat="life">Life</div>
                    <div class="pill" data-cat="mindset">Mindset</div>
                </div>
                <button class="log-btn" id="log-btn">Log Progress</button>
            </div>
        </div>

        <div class="grid" id="grid"></div>

        <div class="footer">
            <button class="btn-ghost" id="export-btn">Export Data</button>
            <button class="btn-ghost" id="import-btn">Import Data</button>
            <input type="file" id="file-input" accept=".json" style="display: none;">
        </div>
    </div>

    <script>
        // State Management
        const STORAGE_KEY = 'life_progress_premium_v1';
        let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentCategory = 'career';

        // DOM
        const grid = document.getElementById('grid');
        const input = document.getElementById('input');
        const logBtn = document.getElementById('log-btn');
        const totalCount = document.getElementById('total-count');
        const streakCount = document.getElementById('streak-count');
        const pills = document.querySelectorAll('.pill');

        // Auto-resizing Textarea
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
        });

        // Category Selection
        pills.forEach(pill => {
            pill.addEventListener('click', () => {
                pills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentCategory = pill.dataset.cat;
            });
        });

        // Calculate Streak (consecutive days with logs)
        function calculateStreak() {
            if (data.length === 0) return 0;
            
            const uniqueDays = [...new Set(data.map(item => new Date(item.id).toDateString()))];
            let streak = 0;
            let checkDate = new Date();

            // If no log today, start checking from yesterday
            if (!uniqueDays.includes(checkDate.toDateString())) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (uniqueDays.includes(checkDate.toDateString())) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            }
            return streak;
        }

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            render();
        }

        function formatDate(ts) {
            const d = new Date(ts);
            const now = new Date();
            const diff = (now - d) / (1000 * 60 * 60 * 24);
            
            if (diff < 1 && now.getDate() === d.getDate()) return "Today";
            if (diff < 2) return "Yesterday";
            
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function render() {
            totalCount.textContent = data.length;
            streakCount.textContent = calculateStreak();

            if (data.length === 0) {
                grid.innerHTML = '<div class="empty-state">Your journey starts now.<br>Add your first milestone above.</div>';
                return;
            }

            // Sort newest first
            const sorted = [...data].sort((a, b) => b.id - a.id);
            
            grid.innerHTML = sorted.map((item, i) => `
                <div class="card" style="animation-delay: ${i * 0.05}s" data-id="${item.id}">
                    <button class="delete-btn" data-del="${item.id}">✕</button>
                    <div class="card-header">
                        <span class="tag ${item.category}">${item.category}</span>
                        <span class="date">${formatDate(item.id)}</span>
                    </div>
                    <div class="content">${item.text}</div>
                </div>
            `).join('');

            // Add Spotlight Listeners
            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                });
            });

            // Delete Listeners
            grid.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.del);
                    const card = btn.closest('.card');
                    card.style.transition = 'all 0.4s var(--ease)';
                    card.style.transform = 'scale(0.9)';
                    card.style.opacity = '0';
                    setTimeout(() => {
                        data = data.filter(d => d.id !== id);
                        save();
                    }, 400);
                });
            });
        }

        function addLog() {
            const text = input.value.trim();
            if (!text) {
                input.style.transition = 'transform 0.1s';
                input.style.transform = 'translateX(10px)';
                setTimeout(() => input.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => input.style.transform = 'translateX(0)', 200);
                return;
            }

            data.push({
                id: Date.now(),
                text: text,
                category: currentCategory
            });
            
            input.value = '';
            input.style.height = 'auto';
            save();
        }

        logBtn.addEventListener('click', addLog);
        input.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') addLog();
        });

        // Backup System
        document.getElementById('export-btn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `progress-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        });

        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    data = [...data, ...imported];
                    save();
                } catch (err) { alert("Invalid backup file"); }
            };
            reader.readAsText(e.target.files[0]);
        });

        // Initial Render
        render();
    </script>
</body>
</html>
